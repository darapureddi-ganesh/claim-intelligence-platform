# Test, build, push and deploy to Cloud Run (run deploy/setup.sh once first):
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=asia-south1
substitutions:
  _REGION: asia-south1
  _SERVICE: claimsaathi
  _REPO: claimsaathi

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: sh
    args:
      - -c
      - pip install --quiet -r requirements.txt pytest pytest-asyncio && python -m pytest -q tests/unit tests/gemini

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_SERVICE}-sa@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --timeout=3600
      - --session-affinity
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},STORAGE_BACKEND=firestore

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
options:
  logging: CLOUD_LOGGING_ONLY
